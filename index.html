<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>טופס בדיקה</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--tx:#1d1d1b;--mu:#6b675f;--ac:#1f4e79;--bd:#ddd8cc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--card:#262623;--tx:#eee9de;--mu:#a8a398;--ac:#7fb0dc;--bd:#3d3b36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1a18;--card:#262623;--tx:#eee9de;--mu:#a8a398;--ac:#7fb0dc;--bd:#3d3b36;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Arial,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.q p{margin:0 0 8px;font-weight:600}
.q label{margin-inline-end:18px;cursor:pointer}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;color:var(--mu);font-size:.9rem}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:12px 24px;font-size:1rem;cursor:pointer}
#res{margin-top:16px;font-size:1.1rem;font-weight:700;line-height:1.8}
</style>
</head>
<body>
<main>
<h1>טופס בדיקה</h1>
<div class="bar" id="bar">נענו 0 מתוך 0</div>
<form id="f" onsubmit="return false"></form>
<button id="go">שלח טופס</button>
<div id="res"></div>
</main>
<script>
var Q=[
["האם פעם היה ברשותך סמארטפון, מסונן או לא מסונן?","החזקת סמארטפון"],
["האם פעם השתתפת בחסימת כבישים, בכל וריאציה שהיא?","השתתפת בחסימת כבישים"],
["האם פעם עלית לאוטובוס בלי לשלם?","עלית לאוטובוס בלי לשלם"],
["האם פעם שילמת על הנסיעה אבל ישבת במקום מעורב?","ישבת במקום מעורב באוטובוס"],
["האם פעם הלכת למופע זמר?","הלכת למופע זמר"],
["האם פעם נלחמת במופע זמר?","נלחמת במופע זמר"],
["האם פעם עסקת במחקרים?","עסקת במחקרים"],
["האם פעם למדת פשוטו של מקרא?","למדת פשוטו של מקרא"],
["האם פעם למדת בישיבה הנתונה במחלוקת?","למדת בישיבה הנתונה במחלוקת"],
["האם פעם לא הצבעת בבחירות?","לא הצבעת בבחירות"],
["האם פעם הצבעת בבחירות?","הצבעת בבחירות"],
["האם פעם סירבת לקבל ספרדים למוסד?","סירבת לקבל ספרדים למוסד"],
["האם פעם מסרת לרשויות את מי שסירב לקבל אותך למוסד?","מסרת לרשויות את מי שסירב לקבל אותך למוסד"],
["האם פעם תמכת בחיילים?","תמכת בחיילים"],
["האם פעם רדפת חיילים?","רדפת חיילים"],
["האם פעם רימית בארנונה?","רימית בארנונה"],
["האם פעם טבלת במקווה ריין?","טבלת במקווה ריין"],
["האם פעם הסתובבת בלי מסכה בתקופת הקורונה?","הסתובבת בלי מסכה בקורונה"],
["האם פעם אכלת לפני התפילה?","אכלת לפני התפילה"],
["האם פעם לא ידעת מהי תפילה?","לא ידעת מהי תפילה"],
["האם פעם גילחת זקן?","גילחת זקן"],
["האם פעם אכלת עופות פטם?","אכלת עופות פטם"],
["האם פעם ישנת מחוץ לסוכה?","ישנת מחוץ לסוכה"],
["האם פעם הקמת סוכה ברשות הרבים?","הקמת סוכה ברשות הרבים"],
["האם פעם החזרת בקבוק ג'אמפ עם יותר פרי?","החזרת בקבוק ג'אמפ עם יותר פרי"],
["האם פעם טבלת במקווה חם בשבת?","טבלת במקווה חם בשבת"],
["האם פעם טבלת במקווה רק בערב יום כיפור?","טבלת במקווה רק בערב יום כיפור"],
["האם פעם עמדת שמונה עשרה בכניסה לשטיבל?","עמדת שמונה עשרה בכניסה לשטיבל"],
["האם פעם עברת מול מתפלל שעומד בכניסה לשטיבל?","עברת מול מתפלל שעומד בכניסה לשטיבל"],
["האם פעם טלטלת ברחוב בשבת?","טלטלת ברחוב בשבת"],
["האם פעם לא הודית בעירוב?","לא הודית בעירוב"],
["האם פעם שיחקת בקוביה בהשקעה בשוק ההון?","שיחקת בקוביה בשוק ההון"],
["האם פעם שמרת כסף מתחת לבלטות במקום לחשוב על העתיד של ילדיך?","שמרת כסף מתחת לבלטות"],
["האם פעם ניהלת מוסד?","ניהלת מוסד"],
["האם פעם עישנת?","עישנת"],
["האם פעם, כנהג, הספרצת מים על עוברים ושבים?","הספרצת מים על עוברים ושבים"],
["האם פעם, כעובר, חצית כביש באור אדום ועיכבת נהגים?","חצית כביש באור אדום ועיכבת נהגים"],
["האם פעם אכלת על כשרות לא מהודרת?","אכלת על כשרות לא מהודרת"],
["האם פעם השמצת כשרות שטובה לא פחות מהמהודרת?","השמצת כשרות שטובה לא פחות מהמהודרת"],
["האם פעם, כמחנך, הצקת לתלמידים?","הצקת לתלמידים"],
["האם פעם, כילד, הצקת למחנך?","הצקת למחנך"],
["האם פעם היית מחנך?","היית מחנך"],
["האם פעם גנבת טשולנט בישיבה?","גנבת טשולנט מהישיבה"],
["האם פעם שתית אייס קפה ברחובה של עיר?","שתית אייס קפה ברחובה של עיר"],
["האם פעם תלית מודעות פיראטיות?","תלית מודעות פיראטיות"],
["האם פעם תלשת מודעות פרטיות?","תלשת מודעות פרטיות"],
["האם פעם עברת על איסור מדאורייתא?","עברת על איסור מדאורייתא"],
["האם פעם עברת על איסור מדרבנן?","עברת על איסור מדרבנן"]
];
var f=document.getElementById("f"),bar=document.getElementById("bar"),res=document.getElementById("res");
Q.forEach(function(q,i){
 var d=document.createElement("div");d.className="q";
 d.innerHTML="<p>"+(i+1)+". "+q[0]+"</p>"+
 "<label><input type='radio' name='q"+i+"' value='y'> כן</label>"+
 "<label><input type='radio' name='q"+i+"' value='n'> לא</label>"+
 "<label><input type='radio' name='q"+i+"' value='u'> לא זוכר</label>";
 f.appendChild(d);
});
function upd(){bar.textContent="נענו "+f.querySelectorAll("input:checked").length+" מתוך "+Q.length}
f.addEventListener("change",upd);upd();
function cdf(z){var t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function pct(n){var m=Q.length*0.35,sd=Math.sqrt(Q.length*0.35*0.65);var p=Math.round(100*(1-cdf((n-0.5-m)/sd)));return Math.max(1,Math.min(99,p))}
var ENDPOINT="https://script.google.com/macros/s/AKfycbxmaiJyGZU9IE2zzfqlKu0Pn1F5_WCNM2_VpK55egiLituZ4Dso2npGgs6z0iY0ZmIYng/exec";/* הדבק כאן את כתובת ה-Web App של Google Apps Script */
var MIN_PRIOR=10;
function getPct(n){
 var est=pct(n);
 if(!ENDPOINT)return Promise.resolve(est);
 var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},8000);
 return fetch(ENDPOINT+"?yes="+n,{signal:ctl.signal}).then(function(r){return r.json()}).then(function(j){
  clearTimeout(t);
  if(!j||typeof j.total!=="number"||j.total<MIN_PRIOR)return est;
  return Math.round(100*j.more/j.total);
 }).catch(function(){clearTimeout(t);return est});
}
var btn=document.getElementById("go");
btn.onclick=function(){
 var n=f.querySelectorAll("input:checked").length;
 if(n<Q.length){res.textContent="נותרו "+(Q.length-n)+" שאלות ללא מענה.";return}
 var facts=[];
 Q.forEach(function(q,i){if(f.querySelector("input[name='q"+i+"']:checked").value==="y")facts.push(q[1])});
 btn.disabled=true;res.textContent="מחשב...";
 getPct(facts.length).then(function(P){
  res.innerHTML="";
  if(!facts.length){res.textContent="מזל טוב! אתה כשר לכולי עלמא. נתראה בחתונת המיליון.";return}
  var p=document.createElement("p");
  p.appendChild(document.createTextNode("לצערנו לא תוכל להיות עד בחתונת המיליון, "+facts.join(", ")+", פרד ופרדה יאלצו להמשיך לחפש עדים כשרים לכולי עלמא "));
  var em=document.createElement("em");em.textContent="(נסה את מזלך בפול\"ת 😕)";
  p.appendChild(em);
  p.appendChild(document.createTextNode(", אבל אתה בדרך, אתה מהודר יותר מ-"+P+"% מהאוכלוסייה."));
  res.appendChild(p);
 });
};
</script>
</body>
</html>
